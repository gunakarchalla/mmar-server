name: CI

# The test suite drives the real API against a real database rather than mocking
# either, so the job builds the whole stack: a throwaway PostgreSQL loaded from
# mmar-database/init.sql, the server built and started against it, then mocha.
#
# The checkout is deliberately two repositories deep: mmar-server compiles against
# mmar-global-data-structure through a TypeScript project reference, and its schema
# lives in mmar-database.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: api
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: api
        ports:
          - 5432:5432
        # The server refuses to start until the database answers, so the job waits
        # for the same condition rather than sleeping and hoping.
        options: >-
          --health-cmd "pg_isready -U api -d api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: api
      PGPASSWORD: ci-postgres-password
      PGDATABASE: api
      # Not a secret: it signs tokens for a database that is destroyed with the
      # job. It only has to satisfy the 32 character minimum the server enforces.
      JWT_SECRET: ci-only-not-a-secret-0123456789abcdefghijklmnop
      NODE_ENV: development
      HTTPPORT: 8000

    steps:
      - name: Check out mmar-server
        uses: actions/checkout@v4
        with:
          path: mmar-server

      - name: Check out mmar-global-data-structure
        uses: actions/checkout@v4
        with:
          repository: MM-AR/mmar-global-data-structure
          ref: develop
          path: mmar-global-data-structure

      - name: Check out mmar-database
        uses: actions/checkout@v4
        with:
          repository: MM-AR/mmar-database
          ref: develop
          path: mmar-database

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mmar-server/package-lock.json

      - name: Load the schema
        run: psql "postgresql://api:$PGPASSWORD@localhost:5432/api" -v ON_ERROR_STOP=1 -f mmar-database/init.sql

      - name: Install dependencies
        working-directory: mmar-server
        run: npm ci

      - name: Fail on known vulnerabilities
        working-directory: mmar-server
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: mmar-server
        run: npm run lint

      - name: Build
        working-directory: mmar-server
        run: npx tsc --build

      - name: Start the server
        working-directory: mmar-server
        run: |
          cp -r config views ../dist/mmar-server/
          node ../dist/mmar-server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/test > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat server.log; exit 1

      - name: Test
        working-directory: mmar-server
        run: npm test

      - name: Server log
        if: failure()
        working-directory: mmar-server
        run: cat server.log
